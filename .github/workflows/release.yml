name: release

# Manual only. Start it from the Actions tab (Run workflow). It builds the
# portable exe, packages it in a zip, and publishes that zip to GitHub Releases.
# By default it increases the patch version automatically; you can also choose
# minor/major or type an exact version when you run it.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which version part to increase'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: 'Exact version, optional (overrides bump, e.g. 1.2.0)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Decide version
        id: ver
        shell: pwsh
        run: |
          $override = '${{ inputs.version }}'.Trim()
          if ($override) {
            if ($override -notmatch '^\d+\.\d+\.\d+$') { Write-Error 'version must look like 1.2.3'; exit 1 }
            $version = $override
          } else {
            git fetch --tags --force | Out-Null
            $tags = git tag --list 'v*.*.*' |
              ForEach-Object { $_.TrimStart('v') } |
              Where-Object { $_ -match '^\d+\.\d+\.\d+$' } |
              ForEach-Object { [version]$_ } |
              Sort-Object
            if (-not $tags) {
              $version = '1.0.0'
            } else {
              $last = $tags[-1]
              switch ('${{ inputs.bump }}') {
                'major' { $version = '{0}.0.0' -f ($last.Major + 1) }
                'minor' { $version = '{0}.{1}.0' -f $last.Major, ($last.Minor + 1) }
                default { $version = '{0}.{1}.{2}' -f $last.Major, $last.Minor, ($last.Build + 1) }
              }
            }
          }
          if (git tag --list "v$version") { Write-Error "tag v$version already exists"; exit 1 }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release version: $version"

      - name: Build portable exe
        shell: pwsh
        run: >
          dotnet publish pdanet-windows/PdaNetPortable.csproj
          -c Release -o dist
          -p:Version=${{ steps.ver.outputs.version }}

      - name: Package portable zip
        id: pack
        shell: pwsh
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          if (-not (Test-Path dist/PdaNetPortable.exe)) { Write-Error 'build output dist/PdaNetPortable.exe not found'; exit 1 }
          # Bundle the exe with the readme and licence so the download explains itself.
          Copy-Item README.md, LICENSE -Destination dist
          $zip = "PdaNetPortable-v$version-win-x64.zip"
          Compress-Archive -Path dist/PdaNetPortable.exe, dist/README.md, dist/LICENSE -DestinationPath $zip -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Packaged $zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PdaNet Windows v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.pack.outputs.zip }}
